<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <linearGradient id="xGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4A8"/>
      <stop offset="100%" style="stop-color:#00D4C8"/>
    </linearGradient>
  </defs>
  
  <!-- X Symbol -->
  <g transform="translate(5, 8)">
    <!-- X mark with rounded ends -->
    <path d="M4 4 L28 30 M28 4 L4 30" 
          stroke="url(#xGradient)" 
          stroke-width="5" 
          stroke-linecap="round" 
          fill="none"/>
    <!-- Small circle nodes at intersections -->
    <circle cx="16" cy="17" r="4" fill="#00B4A8"/>
  </g>
  
  <!-- Text: XOPOLIS -->
  <text x="48" y="35" 
        font-family="'Neue Haas Grotesk Display Pro', 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="28" 
        font-weight="700" 
        letter-spacing="-0.02em"
        fill="#1D1D1F">
    XOPOLIS
  </text>
</svg>
