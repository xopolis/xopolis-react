# Xopolis Corporate Website - Netlify Configuration
# Deploy to xopol.is

[build]
  # If deploying from parent repo, set base = "xopolis-landing" in Netlify UI
  publish = "."
  command = "echo 'Static site — no build needed'"

[build.environment]
  NODE_VERSION = "18"

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML files - short cache
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Form submission settings
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# Redirects (also in _redirects file)
[[redirects]]
  from = "/heurisight"
  to = "/platforms/heurisight.html"
  status = 200

[[redirects]]
  from = "/protobots"
  to = "/platforms/protobots.html"
  status = 200

[[redirects]]
  from = "/xresearch"
  to = "/platforms/xresearch.html"
  status = 200

[[redirects]]
  from = "/tokosmart"
  to = "/tokosmart.html"
  status = 200

[[redirects]]
  from = "/research"
  to = "/research/index.html"
  status = 200

[[redirects]]
  from = "/government"
  to = "/government/index.html"
  status = 200
